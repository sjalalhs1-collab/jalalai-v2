<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><meta name="description" content="JalalAI — all-in-one AI assistant for research, files, data, code and creative work."><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/jalalai-icon-32.png"><link rel="apple-touch-icon" href="/assets/jalalai-icon-180.png"><title>JalalAI Command Center</title><link rel="stylesheet" href="/app.css"></head>
<body><main class="shell">
<header><div><div class="brand"><img src="/assets/jalalai-icon-192.png" alt="JalalAI logo"><div><div class="eyebrow">JALALAI</div><h1>Autonomous Intelligence Command Center</h1><p>Plan → experts → research → debate → verify → answer</p></div></div></div><div class="headTools"><div class="viewToggle" role="group" aria-label="View mode"><button id="viewSimple" class="toggleBtn" type="button">Simple</button><button id="viewAdvanced" class="toggleBtn" type="button">Advanced</button></div><a href="/home.html" class="ghost" style="text-decoration:none;display:inline-flex;align-items:center;padding:0 14px">Home</a><div id="health" class="pill">Checking core…</div><input id="apiToken" class="token" type="password" autocomplete="off" placeholder="API token (local)" aria-label="JalalAI API token"><button id="clearToken" class="ghost" type="button">Clear</button></div></header>
<section class="workspace">
<div class="panel composer"><div class="label">TASK</div><label for="files" class="visuallyHidden">Attach files (optional)</label><input id="files" class="advancedOnly" type="file" multiple accept=".txt,.md,.json,.csv,.log,.xml,.html,.js,.ts,.py,.sql" />
      <label for="input" class="visuallyHidden">Describe the task you want JalalAI to do</label><textarea id="input" placeholder="Ask JalalAI to research, analyse, plan, write or solve something…"></textarea><div class="controls"><label for="mode" class="visuallyHidden">Execution mode</label><select id="mode" class="advancedOnly"><option value="fast">FAST — quick execution</option><option value="deep">DEEP — research + reasoning</option><option value="verified">VERIFIED — fail-closed evidence</option></select><button id="run">Run task</button><button id="cancel" disabled>Stop</button></div><div id="error" class="error" role="alert"></div></div>
<div class="panel status advancedOnly"><div class="row"><div><div class="label">EXECUTION</div><strong id="taskState">Idle</strong></div><div class="confidence"><span>Confidence</span><b id="confidence">—</b></div></div><div id="timeline" class="timeline"><div class="empty">Your execution timeline will appear here.</div></div></div>
<div class="panel answer"><div class="label">ANSWER</div><article id="answer">No task has been run yet.</article></div>
<div class="panel sources advancedOnly"><div class="label">SOURCES & EVIDENCE</div><div id="sources" class="sourceList"><div class="empty">No evidence yet.</div></div></div>
</section></main><script src="/app.js"></script></body></html>
